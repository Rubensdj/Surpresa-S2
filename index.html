<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surpresa 3D – Pedido de Namoro</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js" integrity="sha512-6HvE93jIsGyTekUmqPVcJJRNxP2xSgKcEhHRRcamFIgRkPLQ/D62n4j6qp5ghvTsYC6pjsfNmzHFeYENnU9VAw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div class="overlay">
    <h1>Meu Amor,</h1>
    <p>Quero fazer este pedido de forma especial, em 3D.</p>
    <button id="open-contract">Abrir Contrato</button>
  </div>
  <canvas id="three-canvas"></canvas>

  <div id="contract-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close" id="close-contract">&times;</span>
      <h2>Contrato de Amor</h2>
      <p>Eu, <span class="underline">[seu nome]</span>, aceito ser seu namorado oficial.</p>
      <p>Assine abaixo:</p>
      <canvas id="signature" width="300" height="100" style="border:1px solid #ccc;"></canvas>
      <button id="clear-signature">Limpar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
