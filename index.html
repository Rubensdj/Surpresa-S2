<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surpresa para Ela</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Meu Amor,</h1>
    <p>Desde o dia em que nos conhecemos, descobri que a vida ficou muito melhor ao seu lado.</p>
    <section id="video-section">
      <h2>Um vídeo para você</h2>
      <!-- Vídeo será inserido aqui futuramente -->
      <div class="placeholder">[Vídeo aqui]</div>
    </section>
    <section id="gallery-section">
      <h2>Memórias</h2>
      <!-- Fotos serão inseridas aqui futuramente -->
      <div class="placeholder">[Galeria de fotos aqui]</div>
    </section>
    <section id="contract-section">
      <h2>Contrato de Amor</h2>
      <p>Eu, <span class="underline">[seu nome]</span>, aceito ser seu namorado oficial.</p>
      <p>Assine abaixo:</p>
      <canvas id="signature" width="300" height="100" style="border:1px solid #ccc;"></canvas>
      <button id="clear">Limpar</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
